name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate packaging files
        run: |
          plutil -lint Packaging/Info.plist
          bash -n scripts/build-app.sh
          bash -n scripts/package-release.sh
          bash -n scripts/test-release-architectures.sh
          bash -n scripts/verify-release-zip.sh
          bash -n scripts/verify-executable-architectures.sh
          bash -n scripts/smoke-ui.sh
          bash -n scripts/validate-release-config.sh
          bash -n scripts/test-release-config.sh
          scripts/test-release-config.sh
          scripts/test-release-architectures.sh
          zip_path="$(scripts/verify-release-zip.sh)"
          shasum -a 256 "${zip_path}" > "${zip_path}.sha256"
          test -s "${zip_path}.sha256"
