name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Build a signed dry run or an ad-hoc preview
        required: true
        default: signed-dry-run
        type: choice
        options:
          - signed-dry-run
          - preview
      publish_preview:
        description: Publish the preview as a draft prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-release:
    name: Build release
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.version.outputs.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Packaging/Info.plist)"
          tag="${GITHUB_REF_NAME#v}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the exact vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi
            if [[ "${version}" != "${tag}" ]]; then
              echo "Info.plist version ${version} does not match tag ${GITHUB_REF_NAME}." >&2
              exit 1
            fi
            mode="release"
          else
            mode="${{ inputs.mode }}"
            if [[ "${mode}" == "signed-dry-run" && "${{ inputs.publish_preview }}" == "true" ]]; then
              echo "Signed dry runs cannot publish preview releases." >&2
              exit 1
            fi
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Validate release provenance
        if: steps.version.outputs.mode == 'release'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} does not point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate packaging files
        run: |
          plutil -lint Packaging/Info.plist
          bash -n scripts/build-app.sh
          bash -n scripts/package-release.sh
          bash -n scripts/generate-release-checksum.sh
          bash -n scripts/verify-release-checksum.sh
          bash -n scripts/test-release-checksum.sh
          bash -n scripts/extract-release-changelog.sh
          bash -n scripts/test-release-changelog.sh
          bash -n scripts/test-release-architectures.sh
          bash -n scripts/verify-release-zip.sh
          bash -n scripts/verify-executable-architectures.sh
          bash -n scripts/smoke-ui.sh
          bash -n scripts/validate-release-config.sh
          bash -n scripts/test-release-config.sh
          scripts/test-release-config.sh
          scripts/test-release-architectures.sh
          scripts/test-release-checksum.sh
          scripts/test-release-changelog.sh

      - name: Validate signing configuration
        id: signing
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 || '' }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
          APPLE_DEVELOPER_IDENTITY: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_DEVELOPER_IDENTITY || '' }}
          APPLE_NOTARIZATION_APPLE_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_APPLE_ID || '' }}
          APPLE_NOTARIZATION_KEY_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_KEY_ID || '' }}
          APPLE_NOTARIZATION_PASSWORD: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_PASSWORD || '' }}
          APPLE_NOTARIZATION_PRIVATE_KEY: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_PRIVATE_KEY || '' }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_ISSUER_ID || '' }}
          APPLE_NOTARIZATION_TEAM_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_TEAM_ID || '' }}
        run: scripts/validate-release-config.sh "${{ steps.version.outputs.mode }}"

      - name: Import Developer ID certificate
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

      - name: Write App Store Connect API key
        id: notary_key
        if: steps.signing.outputs.notary_method == 'api-key'
        env:
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_PRIVATE_KEY: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARIZATION_KEY_ID}.p8"
          umask 077
          printf '%s' "${APPLE_NOTARIZATION_PRIVATE_KEY}" > "${key_path}"

          if ! grep -q "BEGIN PRIVATE KEY" "${key_path}"; then
            echo "APPLE_NOTARIZATION_PRIVATE_KEY does not look like an App Store Connect API private key." >&2
            exit 1
          fi

          echo "key_path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Package app
        id: package
        env:
          CODESIGN_IDENTITY: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_DEVELOPER_IDENTITY || '' }}
          NOTARIZE_APPLE_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_APPLE_ID || '' }}
          NOTARIZE_KEY_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_KEY_ID || '' }}
          NOTARIZE_KEY_PATH: ${{ steps.notary_key.outputs.key_path }}
          NOTARIZE_PASSWORD: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_PASSWORD || '' }}
          NOTARIZE_ISSUER_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_ISSUER_ID || '' }}
          NOTARIZE_TEAM_ID: ${{ steps.version.outputs.mode != 'preview' && secrets.APPLE_NOTARIZATION_TEAM_ID || '' }}
        run: |
          if [[ "${{ steps.signing.outputs.notarize }}" == "true" ]]; then
            export REQUIRE_NOTARIZATION=1
          fi

          zip_path="$(scripts/verify-release-zip.sh)"
          sha_path="$(scripts/generate-release-checksum.sh "${zip_path}")"
          scripts/verify-release-checksum.sh "${zip_path}" "${sha_path}"
          if [[ "${{ steps.signing.outputs.notarize }}" == "true" ]]; then
            signing_status="Developer ID signed, notarized, stapled, and accepted by Gatekeeper."
          else
            signing_status="Ad-hoc signed developer preview. Not notarized; macOS Gatekeeper may require manual approval."
          fi

          {
            echo "zip_path=${zip_path}"
            echo "sha_path=${sha_path}"
            echo "signing_status=${signing_status}"
          } >> "${GITHUB_OUTPUT}"

      - name: Remove signing credentials
        if: always() && steps.signing.outputs.notarize == 'true'
        run: |
          security delete-keychain "${RUNNER_TEMP}/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "${RUNNER_TEMP}/developer-id.p12" \
            "${RUNNER_TEMP}"/AuthKey_*.p8

      - name: Write release notes
        run: |
          if [[ "${{ steps.version.outputs.mode }}" == "preview" ]]; then
            release_heading="Ad-hoc preview"
          else
            release_heading="Public release"
          fi
          changelog_section="$(scripts/extract-release-changelog.sh '${{ steps.version.outputs.version }}')"
          {
            printf '## dm-annotate %s\n\n%s of Digital Meld Annotate, a native, local-only macOS screen annotation tool.\n\n' \
              '${{ steps.version.outputs.version }}' "${release_heading}"
            printf "## What's improved\n\n%s\n\n" "${changelog_section}"
            cat <<'EOF'
          ### Install

          1. Download `dm-annotate-${{ steps.version.outputs.version }}-macos.zip`.
          2. Unzip it.
          3. Move `Digital Meld Annotate.app` to `/Applications`.
          4. Open the app and grant macOS permissions when prompted.

          ### Verification

          This release workflow ran:

          - `swift build`
          - `swift test`
          - `plutil -lint Packaging/Info.plist`
          - packaging script syntax checks
          - release zip install and launch smoke verification
          - universal executable verification (`arm64` and `x86_64`)
          - portable release zip SHA256 generation and verification

          Verify the downloaded assets from the directory containing them:

          - macOS: `shasum -a 256 -c dm-annotate-${{ steps.version.outputs.version }}-macos.zip.sha256`
          - Linux: `sha256sum -c dm-annotate-${{ steps.version.outputs.version }}-macos.zip.sha256`

          ### Signing status

          ${{ steps.package.outputs.signing_status }}
          EOF
          } > .build/release-notes.md

      - name: Stage release artifacts
        run: |
          artifact_dir=".build/release-artifacts"
          mkdir -p "${artifact_dir}"
          cp "${{ steps.package.outputs.zip_path }}" "${artifact_dir}/"
          cp "${{ steps.package.outputs.sha_path }}" "${artifact_dir}/"
          cp .build/release-notes.md "${artifact_dir}/"
          scripts/verify-release-checksum.sh \
            "${artifact_dir}/dm-annotate-${{ steps.version.outputs.version }}-macos.zip" \
            "${artifact_dir}/dm-annotate-${{ steps.version.outputs.version }}-macos.zip.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: .build/release-artifacts/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish release
    needs: build-release
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' && inputs.publish_preview)
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts

      - name: Validate release artifacts
        run: |
          version="${{ needs.build-release.outputs.version }}"
          test -s "release-artifacts/dm-annotate-${version}-macos.zip"
          test -s "release-artifacts/dm-annotate-${version}-macos.zip.sha256"
          test -s release-artifacts/release-notes.md
          expected_entry="dm-annotate-${version}-macos.zip"
          sidecar="release-artifacts/${expected_entry}.sha256"
          test "$(wc -l < "${sidecar}" | tr -d '[:space:]')" = "1"
          grep -Eq '^[0-9a-f]{64}  [^/]+$' "${sidecar}"
          test "$(sed -E 's/^[0-9a-f]{64}  //' "${sidecar}")" = "${expected_entry}"
          (
            cd release-artifacts
            shasum -a 256 -c "${expected_entry}.sha256"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build-release.outputs.version }}"
          if [[ "${{ needs.build-release.outputs.mode }}" == "preview" ]]; then
            release_tag="preview-${version}-run-${GITHUB_RUN_ID}"
            release_title="dm-annotate ${version} preview"
            release_flags=(--draft --prerelease --target "${GITHUB_SHA}")
          else
            release_tag="${GITHUB_REF_NAME}"
            release_title="dm-annotate ${version}"
            release_flags=()
          fi

          release_args=(
            "release-artifacts/dm-annotate-${version}-macos.zip"
            "release-artifacts/dm-annotate-${version}-macos.zip.sha256"
            --repo "${GITHUB_REPOSITORY}"
            --title "${release_title}"
            --notes-file release-artifacts/release-notes.md
          )
          release_args+=("${release_flags[@]}")
          gh release create "${release_tag}" "${release_args[@]}"
