name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-15
    env:
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
      APPLE_NOTARIZATION_PRIVATE_KEY: ${{ secrets.APPLE_NOTARIZATION_PRIVATE_KEY }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
      APPLE_NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Read version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Packaging/Info.plist)"
          tag="${GITHUB_REF_NAME#v}"

          if [[ "${version}" != "${tag}" ]]; then
            echo "Info.plist version ${version} does not match tag ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Validate packaging files
        run: |
          plutil -lint Packaging/Info.plist
          bash -n scripts/build-app.sh
          bash -n scripts/package-release.sh
          bash -n scripts/verify-release-zip.sh
          bash -n scripts/smoke-ui.sh

      - name: Validate signing configuration
        id: signing
        run: |
          cert_names=(
            APPLE_DEVELOPER_ID_CERTIFICATE_BASE64
            APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
            APPLE_DEVELOPER_IDENTITY
          )
          apple_id_notary_names=(
            APPLE_NOTARIZATION_APPLE_ID
            APPLE_NOTARIZATION_PASSWORD
            APPLE_NOTARIZATION_TEAM_ID
          )
          api_key_notary_names=(
            APPLE_NOTARIZATION_KEY_ID
            APPLE_NOTARIZATION_PRIVATE_KEY
          )

          cert_present="false"
          notary_present="false"
          notary_method="none"
          cert_missing=()
          apple_id_notary_present="false"
          apple_id_notary_missing=()
          api_key_notary_present="false"
          api_key_notary_missing=()

          for name in "${cert_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              cert_present="true"
            else
              cert_missing+=("${name}")
            fi
          done

          for name in "${apple_id_notary_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              apple_id_notary_present="true"
            else
              apple_id_notary_missing+=("${name}")
            fi
          done

          for name in "${api_key_notary_names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              api_key_notary_present="true"
            else
              api_key_notary_missing+=("${name}")
            fi
          done
          if [[ -n "${APPLE_NOTARIZATION_ISSUER_ID:-}" ]]; then
            api_key_notary_present="true"
          fi

          if [[ "${cert_present}" == "true" && "${#cert_missing[@]}" -gt 0 ]]; then
            printf 'Developer ID signing secrets are partially configured. Missing:\n' >&2
            printf -- '- %s\n' "${cert_missing[@]}" >&2
            exit 1
          fi

          if [[ "${apple_id_notary_present}" == "true" && "${#apple_id_notary_missing[@]}" -gt 0 ]]; then
            printf 'Apple ID notarization secrets are partially configured. Missing:\n' >&2
            printf -- '- %s\n' "${apple_id_notary_missing[@]}" >&2
            exit 1
          fi

          if [[ "${api_key_notary_present}" == "true" && "${#api_key_notary_missing[@]}" -gt 0 ]]; then
            printf 'App Store Connect API key notarization secrets are partially configured. Missing:\n' >&2
            printf -- '- %s\n' "${api_key_notary_missing[@]}" >&2
            exit 1
          fi

          if [[ "${apple_id_notary_present}" == "true" && "${api_key_notary_present}" == "true" ]]; then
            echo "Configure either Apple ID notarization secrets or App Store Connect API key notarization secrets, not both." >&2
            exit 1
          fi

          if [[ "${apple_id_notary_present}" == "true" ]]; then
            notary_present="true"
            notary_method="apple-id"
          elif [[ "${api_key_notary_present}" == "true" ]]; then
            notary_present="true"
            notary_method="api-key"
          fi

          if [[ "${cert_present}" == "true" && "${notary_present}" != "true" ]]; then
            echo "Developer ID release signing requires notarization secrets too." >&2
            exit 1
          fi

          if [[ "${notary_present}" == "true" && "${cert_present}" != "true" ]]; then
            echo "Notarization requires Developer ID signing secrets too." >&2
            exit 1
          fi

          if [[ "${cert_present}" == "true" && "${notary_present}" == "true" ]]; then
            echo "notarize=true" >> "${GITHUB_OUTPUT}"
            echo "notary_method=${notary_method}" >> "${GITHUB_OUTPUT}"
          else
            echo "notarize=false" >> "${GITHUB_OUTPUT}"
            echo "notary_method=none" >> "${GITHUB_OUTPUT}"
            echo "No Apple release secrets are configured. Publishing an ad-hoc signed developer preview." >&2
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.notarize == 'true'
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(uuidgen)"

          echo "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"

      - name: Write App Store Connect API key
        id: notary_key
        if: steps.signing.outputs.notary_method == 'api-key'
        run: |
          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARIZATION_KEY_ID}.p8"
          umask 077
          printf '%s' "${APPLE_NOTARIZATION_PRIVATE_KEY}" > "${key_path}"

          if ! grep -q "BEGIN PRIVATE KEY" "${key_path}"; then
            echo "APPLE_NOTARIZATION_PRIVATE_KEY does not look like an App Store Connect API private key." >&2
            exit 1
          fi

          echo "key_path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Package app
        id: package
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          NOTARIZE_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          NOTARIZE_KEY_PATH: ${{ steps.notary_key.outputs.key_path }}
          NOTARIZE_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          NOTARIZE_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          if [[ "${{ steps.signing.outputs.notarize }}" == "true" ]]; then
            export REQUIRE_NOTARIZATION=1
          fi

          zip_path="$(scripts/verify-release-zip.sh)"
          shasum -a 256 "${zip_path}" | tee "${zip_path}.sha256"
          if [[ "${{ steps.signing.outputs.notarize }}" == "true" ]]; then
            signing_status="Developer ID signed, notarized, stapled, and accepted by Gatekeeper."
          else
            signing_status="Ad-hoc signed developer preview. Not notarized; macOS Gatekeeper may require manual approval."
          fi

          {
            echo "zip_path=${zip_path}"
            echo "sha_path=${zip_path}.sha256"
            echo "signing_status=${signing_status}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        run: |
          cat > .build/release-notes.md <<'EOF'
          ## dm-annotate ${{ steps.version.outputs.version }}

          Public developer preview of Digital Meld Annotate, a native, local-only macOS screen annotation tool.

          ### Install

          1. Download `dm-annotate-${{ steps.version.outputs.version }}-macos.zip`.
          2. Unzip it.
          3. Move `Digital Meld Annotate.app` to `/Applications`.
          4. Open the app and grant macOS permissions when prompted.

          ### Verification

          This release workflow ran:

          - `swift build`
          - `swift test`
          - `plutil -lint Packaging/Info.plist`
          - packaging script syntax checks
          - release zip install and launch smoke verification
          - release zip SHA256 generation

          ### Signing status

          ${{ steps.package.outputs.signing_status }}
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.zip_path }}" \
            "${{ steps.package.outputs.sha_path }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "dm-annotate ${{ steps.version.outputs.version }}" \
            --notes-file .build/release-notes.md
